# ══════════════════════════════════════════════════════════════════════════
# CI — runs on every push and pull request.
#
# Nothing here touches production. The deploy workflow requires this to pass
# first, so a red build cannot reach the server.
# ══════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets deploy.yml reuse this as a gate

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Go API ────────────────────────────────────────────────────────────
  api:
    name: API — vet & test
    runs-on: ubuntu-latest
    services:
      # The auth integration tests exercise real SQL; they skip themselves
      # without a database, which would silently hollow out CI. Provide one.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: happyfeet
          POSTGRES_PASSWORD: happyfeet_dev_secret
          POSTGRES_DB: happyfeet
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U happyfeet"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://happyfeet:happyfeet_dev_secret@localhost:5433/happyfeet?sslmode=disable
        run: go run ./cmd/migrate -direction up

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://happyfeet:happyfeet_dev_secret@localhost:5433/happyfeet?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6380/1
        # -race catches the concurrency bugs that only appear under load, which
        # is exactly when you cannot afford to find them.
        run: go test ./... -count=1 -race

      - name: Confirm the integration tests actually ran
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://happyfeet:happyfeet_dev_secret@localhost:5433/happyfeet?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6380/1
        # These tests skip when Postgres is missing. A skip in CI would mean the
        # database path is untested while the job still looks green.
        run: |
          out=$(go test ./internal/auth/... -run TestGoogleSignIn -count=1 -v)
          echo "$out"
          if echo "$out" | grep -q "^--- SKIP"; then
            echo "::error::Google integration tests SKIPPED — the CI database is not reachable"
            exit 1
          fi

  # ── Storefront ────────────────────────────────────────────────────────
  web:
    name: Storefront — types & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        env:
          # A placeholder is fine here: this job proves the build compiles.
          # The real value is baked in the deploy workflow.
          NEXT_PUBLIC_API_URL: https://example.com/api/v1
        run: npm run build

  # ── Images build cleanly ──────────────────────────────────────────────
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only; publishing happens in the deploy workflow. Catching a
      # broken Dockerfile in PR review is much cheaper than at deploy time.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build storefront image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: NEXT_PUBLIC_API_URL=https://example.com/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
