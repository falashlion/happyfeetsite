<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>HappyFeet API — Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="./index.css" >
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <style>
      html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
      *, *:before, *:after { box-sizing: inherit; }
      body { margin:0; background: #fafafa; }
      .topbar { background-color: #1a1a2e !important; }
      .topbar-wrapper .link { content: url('/favicon.ico'); width: 120px; height: auto; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="./swagger-ui-bundle.js" charset="UTF-8"> </script>
    <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "/openapi.yaml",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
        layout: "BaseLayout",
        supportedSubmitMethods: ['get', 'post', 'put', 'patch', 'delete', 'head', 'options', 'trace'],
        validatorUrl: null,
        tryItOutEnabled: true,
        persistAuthorization: true,
        displayRequestDuration: true,
        filter: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 2,
        onComplete: function() {
          ui.preauthorizeApiKey("BearerAuth", "");
        }
      });
      window.ui = ui;
    };
  </script>
  </body>
</html>
